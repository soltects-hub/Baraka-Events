<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Download Source — Baraka Events</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at 50% 30%, #191308 0%, #050505 75%);
      font-family: 'Jost', sans-serif;
      color: #f3ecdd;
      padding: 24px;
    }
    .card {
      max-width: 560px;
      width: 100%;
      text-align: center;
      border: 1px solid rgba(255,150,11,0.25);
      background: rgba(11,11,11,0.7);
      padding: 56px 32px;
      border-radius: 4px;
    }
    .rule { width: 64px; height: 1px; background: rgba(255,150,11,0.6); margin: 0 auto; }
    h1 { font-family: 'Cormorant Garamond', serif; font-weight: 300; font-size: 34px; margin: 22px 0 10px; }
    h1 em { font-style: italic; color: #ffb763; }
    p { font-weight: 300; font-size: 14px; line-height: 1.8; color: rgba(243,236,221,0.6); max-width: 400px; margin: 0 auto; }
    .btn {
      display: inline-block;
      margin-top: 32px;
      background: #ff960b;
      color: #050505;
      text-decoration: none;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      padding: 18px 44px;
      border-radius: 999px;
      transition: transform .3s ease, box-shadow .3s ease;
      box-shadow: 0 10px 40px rgba(255,150,11,0.25);
    }
    .btn:hover { transform: scale(1.04); box-shadow: 0 10px 50px rgba(255,150,11,0.45); }
    .size { margin-top: 16px; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(243,236,221,0.35); }
    .alt { margin-top: 28px; font-size: 12px; color: rgba(243,236,221,0.4); }
    .alt a { color: #ff960b; }
    .back { display: inline-block; margin-top: 34px; font-size: 11px; letter-spacing: 0.25em; text-transform: uppercase; color: rgba(243,236,221,0.45); text-decoration: none; }
    .back:hover { color: #ff960b; }
  </style>
</head>
<body>
  <div class="card">
    <div class="rule"></div>
    <h1>Download the <em>full website</em></h1>
    <p>Complete source code of the Baraka Events website — everything you need to deploy on your own Vercel or GitHub account.</p>
    <a class="btn" href="/baraka-site.zip" download="baraka-site.zip">Download ZIP</a>
    <div class="size">baraka-site.zip &middot; ~4.4 MB</div>
    <p class="alt">If nothing happens, right-click the button and choose<br/><strong>"Save link as…"</strong></p>
    <a class="back" href="/">&larr; Back to website</a>
  </div>
</body>
</html>
