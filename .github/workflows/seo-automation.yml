name: Baraka Events SEO Automation

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # 03:00 UTC = ~08:00 Pakistan Standard Time (UTC+5, no DST) — before the business day starts.
    - cron: '0 3 * * *'

permissions:
  contents: read
  id-token: write

jobs:
  # Lint + build validation. Runs on every push/PR to main and on manual dispatch.
  # Intentionally does NOT run on `schedule` — that trigger is for seo-report below.
  seo-automation:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: baraka-events-seo-automation
          workload_identity_provider: projects/226411024335/locations/global/workloadIdentityPools/github-actions/providers/github-actions
          service_account: baraka-seo-automation@baraka-events-seo-automation.iam.gserviceaccount.com

      - name: Verify Google Cloud authentication
        run: gcloud auth list

      - name: Run lint
        run: npm run lint

      - name: Build website
        run: npm run build

      - name: Verify build and SEO output
        run: |
          test -d dist
          test -f dist/index.html
          test -f dist/robots.txt
          test -f dist/sitemap.xml
          test -f dist/googlebc2c622c6923c88b.html
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('dist/sitemap.xml')"
          npm run seo:verify-sitemap
          echo "Build succeeded and SEO artifacts (robots.txt, sitemap.xml, GSC verification file) are present and valid"

  # Daily SEO growth loop: Search Console -> analysis -> decision -> optional
  # evidence-based content -> QA -> PR. Runs on the cron schedule above, and
  # can be run on demand via workflow_dispatch.
  #
  # This job NEVER pushes to main directly and NEVER auto-merges anything: on
  # a successful, QA-passed run it proposes everything (the report, and any
  # content change) via a single pull request. It creates at most ONE such PR
  # per day (branch name is date-based, so a same-day re-run updates the same
  # PR rather than opening a second one). On an auth/data/QA failure it fails
  # the run loudly instead of opening a PR.
  seo-report:
    # Manual dispatch only runs this job from `main`: create-pull-request
    # defaults a new PR's base to whatever ref the workflow ran on, and the
    # branch name below is date-based (one per day) — dispatching from a
    # feature branch would either corrupt today's real main-based PR or spin
    # up a stray duplicate with the wrong base. Testing branch-specific
    # changes to this job should use the seo-content-path-test job below
    # instead, which never opens a PR.
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    env:
      # No paid AI API is used anywhere in this pipeline. Content generation
      # and the optional AI summary talk to the site owner's own AnythingLLM
      # instance (backed by Ollama/Qwen3:8b), reached over a private
      # Tailscale tailnet this job joins below — never exposed publicly, no
      # router ports opened. ANYTHINGLLM_BASE_URL/ANYTHINGLLM_WORKSPACE_SLUG
      # are non-secret repository variables (unset = the scripts' built-in
      # defaults, matching the real, live-verified instance). If Tailscale
      # or AnythingLLM are unreachable for any reason, content generation
      # and the AI summary skip gracefully — see SEO_AUTOMATION.md.
      ANYTHINGLLM_BASE_URL: ${{ vars.ANYTHINGLLM_BASE_URL }}
      ANYTHINGLLM_WORKSPACE_SLUG: ${{ vars.ANYTHINGLLM_WORKSPACE_SLUG }}
      ANYTHINGLLM_API_KEY: ${{ secrets.ANYTHINGLLM_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: baraka-events-seo-automation
          workload_identity_provider: projects/226411024335/locations/global/workloadIdentityPools/github-actions/providers/github-actions
          service_account: baraka-seo-automation@baraka-events-seo-automation.iam.gserviceaccount.com

      # Ephemeral node, joined only for this job's duration. Lets this job
      # reach the site owner's own 24/7 AnythingLLM/Ollama machine without
      # ever exposing it publicly. If this fails or the required secrets
      # aren't configured, the job continues — content generation and the
      # AI summary just skip gracefully below (Search Console/decision/
      # report/sitemap are unaffected).
      - name: Connect to Tailscale
        continue-on-error: true
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Compute today's date (for a stable, idempotent daily branch/PR name)
        id: date
        run: echo "today=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Collect Search Console data
        id: fetch
        continue-on-error: true
        env:
          SEARCH_CONSOLE_SITE_URL: ${{ vars.SEARCH_CONSOLE_SITE_URL }}
        run: npm run seo:fetch

      - name: Decide next action (Phase 3 decision engine)
        id: decide
        continue-on-error: true
        run: npm run seo:decide

      - name: Track keyword performance (Phase 9)
        continue-on-error: true
        run: npm run seo:keyword-performance

      - name: Report whether AnythingLLM is reachable (informational only)
        continue-on-error: true
        run: |
          node -e "
            const base = process.env.ANYTHINGLLM_BASE_URL || 'http://100.125.143.58:3001';
            fetch(base + '/api/ping', { signal: AbortSignal.timeout(5000) })
              .then((r) => console.log(r.ok ? 'AnythingLLM is reachable — content generation and the AI summary step can run for real.' : 'AnythingLLM responded with HTTP ' + r.status + ' — treating as unreachable.'))
              .catch(() => console.log('AnythingLLM at ' + base + ' is not reachable from this runner. This is expected if the Tailscale connection above did not succeed (see its logs) or the required secrets are not configured. Content generation and the AI summary step will skip gracefully — the rest of the pipeline (Search Console, decision engine, report, sitemap) is unaffected.'));
          "

      - name: Generate content proposal if warranted (Phase 4, gated on AnythingLLM reachability)
        continue-on-error: true
        run: npm run seo:generate-content

      - name: Generate SEO report (Phase 10)
        run: npm run seo:report

      - name: AI-assisted executive summary (optional, gated on AnythingLLM reachability)
        continue-on-error: true
        run: npm run seo:ai-summary

      - name: Apply content proposal to src/lib/posts.ts if one was generated
        id: apply
        continue-on-error: true
        run: npm run seo:apply-content

      - name: Build website (also regenerates sitemap.xml if content was added)
        id: build
        continue-on-error: true
        run: npm run build

      - name: Verify build and SEO output
        id: verify
        continue-on-error: true
        run: |
          test -d dist
          test -f dist/sitemap.xml
          npm run seo:verify-sitemap

      - name: SEO QA gate (Phase 7 — blocks the PR on any failure)
        id: qa
        continue-on-error: true
        run: npm run seo:qa

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-report-${{ github.run_id }}
          path: reports/seo/
          retention-days: 90

      - name: Open PR with the SEO report and any content update
        if: steps.fetch.outcome == 'success' && steps.build.outcome == 'success' && steps.verify.outcome == 'success' && steps.qa.outcome == 'success'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: 'chore(seo): daily SEO report and evidence-based updates'
          title: 'SEO growth loop — ${{ steps.date.outputs.today }}'
          body: |
            Automated daily SEO run: Search Console analysis, deterministic
            decision, and (only when the evidence supported it and QA passed)
            one content update. See `reports/seo/latest.md` for the full
            report, what was decided and why, and exactly what Search Console
            data supports it. `src/lib/posts.ts` and `public/sitemap.xml` are
            only touched if a new article was generated and passed every
            Phase 7 QA check (title/meta/canonical/H1/headings/internal
            links/image/alt/structured data/duplicate-content/cannibalization
            checks). Nothing else is ever changed by this job, and this PR is
            never merged automatically.
          branch: seo-report/${{ steps.date.outputs.today }}
          add-paths: |
            reports/seo/
            src/lib/posts.ts
            public/sitemap.xml
          delete-branch: true

      - name: Fail the run if Search Console data could not be collected
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::error::Search Console data collection failed. See the uploaded 'seo-report-${{ github.run_id }}' artifact (reports/seo/latest.md) for the exact cause and the manual fix required."
          exit 1

      - name: Fail the run if a content update was generated but failed QA/build
        if: steps.fetch.outcome == 'success' && (steps.build.outcome == 'failure' || steps.verify.outcome == 'failure' || steps.qa.outcome == 'failure')
        run: |
          echo "::error::A content update was proposed but did not pass build/verify/QA — no PR was opened. See the uploaded artifact for details. This is expected safety behavior, not a pipeline bug."
          exit 1

  # TEMPORARY — to be removed once real evidence is captured. Now that
  # Ollama is confirmed healthy on the owner's machine, this proves the
  # FULL real content pipeline (not just generation): generate ->
  # apply-content -> build -> verify -> SEO QA, using the real
  # AnythingLLM/Qwen3:8b instance and the exact same scripts the real
  # seo-report job above calls. Uses a safe, non-cannibalizing mock
  # 'new-article' decision (the real decision engine currently and
  # correctly says fix-indexing based on real Search Console data — this
  # is only to force the content path for testing, not something ever
  # done in the real daily job). Never commits, pushes, or opens a PR —
  # the PR step itself (peter-evans/create-pull-request@v7) is unchanged
  # from what already opened PR #7 for real for the deterministic report.
  anythingllm-full-pipeline-test:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Write a safe mock 'new-article' decision (test only, never committed)
        run: |
          mkdir -p reports/seo
          node -e "
            const fs = require('fs');
            const decision = {
              action: 'new-article',
              target: 'Aqeeqah',
              cluster: 'Aqeeqah',
              proposedUrl: '/blog/aqeeqah-celebration-planning-lahore',
              reasoning: ['TEMPORARY DIAGNOSTIC: mock decision used only to prove the full real content pipeline (generate -> apply -> build -> QA) works end-to-end through AnythingLLM/Qwen3:8b without publishing anything.'],
              evidence: {},
            };
            fs.writeFileSync('reports/seo/decision-latest.json', JSON.stringify(decision, null, 2));
          "

      - name: Generate content proposal (real AnythingLLM/Qwen3:8b call)
        id: generate
        env:
          ANYTHINGLLM_API_KEY: ${{ secrets.ANYTHINGLLM_API_KEY }}
        run: npm run seo:generate-content

      - name: Show proposal summary (structure only — no secret, no full body)
        run: |
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('reports/seo/content-proposal-latest.json', 'utf8'));
            console.log('status:', p.status);
            if (p.status === 'generated') {
              console.log('title:', p.post.title);
              console.log('slug:', p.post.slug);
              console.log('blocks:', p.post.blocks.length);
              console.log('has image:', p.post.image !== undefined);
              console.log('model:', p.model);
            } else {
              console.log('reason:', p.reason);
            }
          "

      - name: Apply content proposal to src/lib/posts.ts (test checkout only — never committed or pushed)
        id: apply
        run: npm run seo:apply-content

      - name: Build website (also regenerates sitemap.xml)
        id: build
        run: npm run build

      - name: Verify build and SEO output
        run: |
          test -d dist
          test -f dist/sitemap.xml
          npm run seo:verify-sitemap

      - name: SEO QA gate (Phase 7 — the same gate that blocks the real PR)
        id: qa
        run: npm run seo:qa

      - name: Report full-pipeline result
        if: always()
        run: |
          echo "generate: ${{ steps.generate.outcome }}"
          echo "apply: ${{ steps.apply.outcome }}"
          echo "build: ${{ steps.build.outcome }}"
          echo "qa: ${{ steps.qa.outcome }}"

      - name: Upload proposal artifact (evidence only — never applied to main, never opened as a PR)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anythingllm-full-pipeline-test-${{ github.run_id }}
          path: reports/seo/content-proposal-latest.json
          retention-days: 7
