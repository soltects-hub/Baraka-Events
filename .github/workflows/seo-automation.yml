name: Baraka Events SEO Automation

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # 03:00 UTC = ~08:00 Pakistan Standard Time (UTC+5, no DST) — before the business day starts.
    - cron: '0 3 * * *'

permissions:
  contents: read
  id-token: write

jobs:
  # Lint + build validation. Runs on every push/PR to main and on manual dispatch.
  # Intentionally does NOT run on `schedule` — that trigger is for seo-report below.
  seo-automation:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: baraka-events-seo-automation
          workload_identity_provider: projects/226411024335/locations/global/workloadIdentityPools/github-actions/providers/github-actions
          service_account: baraka-seo-automation@baraka-events-seo-automation.iam.gserviceaccount.com

      - name: Verify Google Cloud authentication
        run: gcloud auth list

      - name: Run lint
        run: npm run lint

      - name: Build website
        run: npm run build

      - name: Verify build and SEO output
        run: |
          test -d dist
          test -f dist/index.html
          test -f dist/robots.txt
          test -f dist/sitemap.xml
          test -f dist/googlebc2c622c6923c88b.html
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('dist/sitemap.xml')"
          npm run seo:verify-sitemap
          echo "Build succeeded and SEO artifacts (robots.txt, sitemap.xml, GSC verification file) are present and valid"

  # Daily SEO growth loop: Search Console -> analysis -> decision -> optional
  # evidence-based content -> QA -> PR. Runs on the cron schedule above, and
  # can be run on demand via workflow_dispatch.
  #
  # This job NEVER pushes to main directly and NEVER auto-merges anything: on
  # a successful, QA-passed run it proposes everything (the report, and any
  # content change) via a single pull request. It creates at most ONE such PR
  # per day (branch name is date-based, so a same-day re-run updates the same
  # PR rather than opening a second one). On an auth/data/QA failure it fails
  # the run loudly instead of opening a PR.
  seo-report:
    # Manual dispatch only runs this job from `main`: create-pull-request
    # defaults a new PR's base to whatever ref the workflow ran on, and the
    # branch name below is date-based (one per day) — dispatching from a
    # feature branch would either corrupt today's real main-based PR or spin
    # up a stray duplicate with the wrong base. Testing branch-specific
    # changes to this job should use the seo-content-path-test job below
    # instead, which never opens a PR.
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    env:
      # No paid AI API or API key is used anywhere in this pipeline. Content
      # generation and the optional AI summary talk to Ollama — an
      # open-source, self-hosted model server — configured entirely via
      # these two non-secret repository variables (unset = the scripts'
      # built-in defaults: http://localhost:11434 and "qwen3"). A
      # GitHub-hosted runner cannot reach a laptop's own localhost, so
      # unattended generation here requires OLLAMA_BASE_URL to point at a
      # reachable server, or this job to run on a self-hosted runner with
      # Ollama installed — see SEO_AUTOMATION.md.
      OLLAMA_BASE_URL: ${{ vars.OLLAMA_BASE_URL }}
      OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: baraka-events-seo-automation
          workload_identity_provider: projects/226411024335/locations/global/workloadIdentityPools/github-actions/providers/github-actions
          service_account: baraka-seo-automation@baraka-events-seo-automation.iam.gserviceaccount.com

      - name: Compute today's date (for a stable, idempotent daily branch/PR name)
        id: date
        run: echo "today=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Collect Search Console data
        id: fetch
        continue-on-error: true
        env:
          SEARCH_CONSOLE_SITE_URL: ${{ vars.SEARCH_CONSOLE_SITE_URL }}
        run: npm run seo:fetch

      - name: Decide next action (Phase 3 decision engine)
        id: decide
        continue-on-error: true
        run: npm run seo:decide

      - name: Track keyword performance (Phase 9)
        continue-on-error: true
        run: npm run seo:keyword-performance

      - name: Report whether an Ollama AI backend is reachable (informational only)
        continue-on-error: true
        run: |
          node -e "
            fetch((process.env.OLLAMA_BASE_URL || 'http://localhost:11434') + '/api/tags', { signal: AbortSignal.timeout(5000) })
              .then((r) => console.log(r.ok ? 'Ollama is reachable — content generation and the AI summary step can run for real.' : 'Ollama responded with HTTP ' + r.status + ' — treating as unreachable.'))
              .catch(() => console.log('No Ollama server reachable at ' + (process.env.OLLAMA_BASE_URL || 'http://localhost:11434') + ' from this runner. This is expected unless OLLAMA_BASE_URL points at a reachable server, or this job runs on a self-hosted runner with Ollama installed. Content generation and the AI summary step will skip gracefully — the rest of the pipeline (Search Console, decision engine, report, sitemap) is unaffected.'));
          "

      - name: Generate content proposal if warranted (Phase 4, gated on Ollama reachability)
        continue-on-error: true
        run: npm run seo:generate-content

      - name: Generate SEO report (Phase 10)
        run: npm run seo:report

      - name: AI-assisted executive summary (optional, gated on Ollama reachability)
        continue-on-error: true
        run: npm run seo:ai-summary

      - name: Apply content proposal to src/lib/posts.ts if one was generated
        id: apply
        continue-on-error: true
        run: npm run seo:apply-content

      - name: Build website (also regenerates sitemap.xml if content was added)
        id: build
        continue-on-error: true
        run: npm run build

      - name: Verify build and SEO output
        id: verify
        continue-on-error: true
        run: |
          test -d dist
          test -f dist/sitemap.xml
          npm run seo:verify-sitemap

      - name: SEO QA gate (Phase 7 — blocks the PR on any failure)
        id: qa
        continue-on-error: true
        run: npm run seo:qa

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-report-${{ github.run_id }}
          path: reports/seo/
          retention-days: 90

      - name: Open PR with the SEO report and any content update
        if: steps.fetch.outcome == 'success' && steps.build.outcome == 'success' && steps.verify.outcome == 'success' && steps.qa.outcome == 'success'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: 'chore(seo): daily SEO report and evidence-based updates'
          title: 'SEO growth loop — ${{ steps.date.outputs.today }}'
          body: |
            Automated daily SEO run: Search Console analysis, deterministic
            decision, and (only when the evidence supported it and QA passed)
            one content update. See `reports/seo/latest.md` for the full
            report, what was decided and why, and exactly what Search Console
            data supports it. `src/lib/posts.ts` and `public/sitemap.xml` are
            only touched if a new article was generated and passed every
            Phase 7 QA check (title/meta/canonical/H1/headings/internal
            links/image/alt/structured data/duplicate-content/cannibalization
            checks). Nothing else is ever changed by this job, and this PR is
            never merged automatically.
          branch: seo-report/${{ steps.date.outputs.today }}
          add-paths: |
            reports/seo/
            src/lib/posts.ts
            public/sitemap.xml
          delete-branch: true

      - name: Fail the run if Search Console data could not be collected
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::error::Search Console data collection failed. See the uploaded 'seo-report-${{ github.run_id }}' artifact (reports/seo/latest.md) for the exact cause and the manual fix required."
          exit 1

      - name: Fail the run if a content update was generated but failed QA/build
        if: steps.fetch.outcome == 'success' && (steps.build.outcome == 'failure' || steps.verify.outcome == 'failure' || steps.qa.outcome == 'failure')
        run: |
          echo "::error::A content update was proposed but did not pass build/verify/QA — no PR was opened. See the uploaded artifact for details. This is expected safety behavior, not a pipeline bug."
          exit 1

  # TEMPORARY — to be removed once real connectivity/generation evidence is
  # captured. Proves GitHub Actions -> Tailscale -> the user's own 24/7
  # Windows machine -> AnythingLLM -> Ollama -> Qwen3:8b works end-to-end,
  # using one harmless test prompt. Joins the private tailnet only for this
  # job's duration (ephemeral node) — AnythingLLM is never exposed publicly,
  # no router ports are opened. Never touches src/lib/posts.ts, never
  # builds, never opens a PR. Never prints the OAuth secret or API key.
  anythingllm-connectivity-test:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Connectivity + auth + generation test against AnythingLLM
        env:
          ANYTHINGLLM_API_KEY: ${{ secrets.ANYTHINGLLM_API_KEY }}
        run: |
          cat > /tmp/allm-diagnostic.mjs <<'SCRIPT'
          const BASE = 'http://100.125.143.58:3001';
          const KEY = process.env.ANYTHINGLLM_API_KEY;

          async function main() {
            let pingOk = false;
            try {
              const r = await fetch(BASE + '/api/ping', { signal: AbortSignal.timeout(10000) });
              pingOk = r.ok;
            } catch (e) {
              console.log('Ping request failed:', e.message);
            }
            console.log('AnythingLLM reachable:', pingOk ? 'YES' : 'NO');
            if (!pingOk) { process.exitCode = 1; return; }

            for (const path of ['/api/docs/json', '/api/docs/swagger.json', '/api/openapi.json']) {
              try {
                const r = await fetch(BASE + path, { signal: AbortSignal.timeout(10000) });
                console.log('Docs spec check', path, '->', r.status);
              } catch (e) {
                console.log('Docs spec check', path, '-> request failed:', e.message);
              }
            }

            let workspaces = [];
            try {
              const r = await fetch(BASE + '/api/v1/workspaces', {
                headers: { Authorization: 'Bearer ' + KEY },
                signal: AbortSignal.timeout(10000),
              });
              console.log('AnythingLLM authentication:', r.ok ? 'YES' : 'NO', '(HTTP ' + r.status + ')');
              if (!r.ok) { process.exitCode = 1; return; }
              const data = await r.json();
              workspaces = data.workspaces || [];
              console.log('Workspaces found:', workspaces.length, workspaces.map((w) => w.slug).join(', '));
            } catch (e) {
              console.log('AnythingLLM authentication: NO (request failed:', e.message + ')');
              process.exitCode = 1;
              return;
            }

            let slug = workspaces.find((w) => w.slug === 'baraka-seo')?.slug || workspaces[0]?.slug;
            if (!slug) {
              console.log('No workspace found — creating one named "baraka-seo".');
              const r = await fetch(BASE + '/api/v1/workspace/new', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + KEY },
                body: JSON.stringify({ name: 'baraka-seo' }),
                signal: AbortSignal.timeout(10000),
              });
              console.log('Workspace creation:', r.ok ? 'YES' : 'NO', '(HTTP ' + r.status + ')');
              if (!r.ok) { process.exitCode = 1; return; }
              const data = await r.json();
              slug = data.workspace?.[0]?.slug || data.workspace?.slug;
            }
            console.log('Using workspace:', slug);
            if (!slug) { process.exitCode = 1; return; }

            console.log('Ollama model configured: qwen3:8b');
            try {
              const r = await fetch(BASE + '/api/v1/workspace/' + slug + '/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + KEY },
                body: JSON.stringify({
                  message: 'Return valid JSON containing exactly: {"status": "ok", "model": "qwen3:8b"} and nothing else.',
                  mode: 'chat',
                }),
                signal: AbortSignal.timeout(150000),
              });
              console.log('Chat HTTP status:', r.status);
              const data = await r.json();
              console.log('Response type:', data.type);
              console.log('Response text (first 400 chars):', String(data.textResponse || data.error || '').slice(0, 400));
            } catch (e) {
              console.log('Generation request failed:', e.message);
              process.exitCode = 1;
            }
          }

          main();
          SCRIPT
          node /tmp/allm-diagnostic.mjs
