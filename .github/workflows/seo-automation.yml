name: Baraka Events SEO Automation

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  seo-automation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: baraka-events-seo-automation
          workload_identity_provider: projects/226411024335/locations/global/workloadIdentityPools/github-actions/providers/github-actions
          service_account: baraka-seo-automation@baraka-events-seo-automation.iam.gserviceaccount.com

      - name: Verify Google Cloud authentication
        run: gcloud auth list

      - name: Run lint
        run: npm run lint

      - name: Build website
        run: npm run build

      - name: Verify build output
        run: test -d dist && echo "Build successful"
