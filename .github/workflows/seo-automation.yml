name: Google Cloud Authentication Test

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test-google-auth:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: baraka-events-seo-automation
          workload_identity_provider: projects/226411024335/locations/global/workloadIdentityPools/github-actions/providers/github-actions
          service_account: baraka-seo-automation@baraka-events-seo-automation.iam.gserviceaccount.com

      - name: Test Google Cloud authentication
        run: gcloud auth list
